name: supabase

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,mailpit
      - run: supabase test db
      - name: Database advisors / lint
        run: supabase db lint --level error --fail-on error

  supabase-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sql-tests]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF in GitHub > Settings > Secrets > Actions"; exit 1; fi
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"
      - run: supabase functions deploy --yes --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
